name: Publicar portal web JZB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web-admin/**"
      - ".github/workflows/publicar-portal-jzb.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jzb-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del portal
        run: |
          mkdir -p dist
          cp -R web-admin/. dist/
          base64 --decode web-admin/app-icon.png.base64 > dist/app-icon.png
          rm dist/app-icon.png.base64
          touch dist/.nojekyll

      - name: Empaquetar portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
