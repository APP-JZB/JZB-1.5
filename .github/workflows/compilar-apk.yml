
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer código fuente
        run: |
          mkdir -p source
          unzip -q hito-zb-arica-main.zip -d source
          APP_DIR=$(find source -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit | xargs dirname)
          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/package-lock.json" ]; then
            echo "No se encontró el proyecto Expo completo."
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Aplicar nombre JZB a la fuente compilada
        run: |
          cp app.json "$APP_DIR/app.json"
          cp App.js "$APP_DIR/App.js"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["APP_DIR"])
          candidates = list(root.glob("src/screens.js"))
          for p in candidates:
              s = p.read_text(encoding="utf-8")
              s = s.replace("ZONA DE BIENESTAR “ARICA”", "JEFATURA DE ZONAS DE BIENESTAR")
              s = s.replace("ZONA DE BIENESTAR \"ARICA\"", "JEFATURA DE ZONAS DE BIENESTAR")
              s = s.replace(">Hito<", ">JZB<")
              s = s.replace("Hito", "JZB")
              p.write_text(s, encoding="utf-8")
          PY

      - name: Instalar dependencias
        working-directory: .
        run: |
          cd "$APP_DIR"
          npm ci
          npx expo install react-native-webview expo-file-system expo-sharing

      - name: Generar proyecto Android
        run: |
          cd "$APP_DIR"
          npx expo prebuild --platform android --no-install

      - name: Compilar APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: JZB-apk
          path: source/**/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
